<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinemark - Faça seu Cadastro</title>

  <!-- Bootstrap (só para o grid/reset, o visual mesmo é do CSS embutido abaixo) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Font Awesome (ícones de pessoa, e-mail, cadeado, google, facebook, apple) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- CSS embutido (RF-001 - Cadastro de Usuário) -->
  <style>
    :root {
      --vermelho: #ff3b4e;
      --fundo-card: #141414;
      --texto-cinza: #b3b3b3;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #b3001b 0%, #4a0008 70%, #1a0002 100%);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .card-login {
      background-color: var(--fundo-card);
      border-radius: 20px;
      padding: 40px 35px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
    }

    .logo-losango {
      width: 70px;
      height: 70px;
      border: 2px solid var(--vermelho);
      transform: rotate(45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
    }

    .logo-losango i {
      transform: rotate(-45deg);
      color: var(--vermelho);
      font-size: 22px;
    }

    .titulo-card {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: bold;
      color: var(--vermelho);
      text-align: center;
      margin-bottom: 25px;
    }

    .input-icone {
      position: relative;
      margin-bottom: 18px;
    }

    .input-icone i {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: var(--vermelho);
    }

    .input-icone .icone-olho {
      left: auto;
      right: 15px;
      color: var(--texto-cinza);
      cursor: pointer;
    }

    .input-icone input {
      width: 100%;
      background-color: #1c1c1c;
      border: 1px solid var(--vermelho);
      border-radius: 8px;
      padding: 12px 40px;
      color: #fff;
    }

    .input-icone input::placeholder {
      color: var(--texto-cinza);
    }

    .input-icone input:focus {
      outline: none;
      box-shadow: 0 0 5px var(--vermelho);
    }

    .divisor {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--texto-cinza);
      font-size: 13px;
      margin: 20px 0;
    }

    .divisor::before,
    .divisor::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #444;
    }

    .divisor:not(:empty)::before {
      margin-right: 10px;
    }

    .divisor:not(:empty)::after {
      margin-left: 10px;
    }

    .icones-sociais {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .icones-sociais a {
      width: 45px;
      height: 45px;
      background-color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      text-decoration: none;
    }

    .icones-sociais .fa-google { color: #ea4335; }
    .icones-sociais .fa-facebook { color: #1877f2; }
    .icones-sociais .fa-apple { color: #000; }

    .link-vermelho {
      display: block;
      text-align: center;
      color: #fff;
      font-size: 14px;
      text-decoration: underline;
      margin-bottom: 20px;
    }

    .link-vermelho:hover {
      color: var(--vermelho);
    }

    .btn-vermelho {
      width: 100%;
      background-color: transparent;
      border: 1px solid var(--vermelho);
      color: var(--vermelho);
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .btn-vermelho:hover {
      background-color: var(--vermelho);
      color: #fff;
    }

    .texto-rodape {
      text-align: center;
      color: #fff;
      font-size: 14px;
    }

    .texto-rodape a {
      color: var(--vermelho);
      text-decoration: none;
    }

    .texto-rodape a:hover {
      text-decoration: underline;
    }

    .texto-explicacao {
      text-align: center;
      color: var(--texto-cinza);
      font-size: 14px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div class="card-login">

    <!-- Logo -->
    <div class="logo-losango">
      <i class="fa-solid fa-play"></i>
    </div>

    <!-- Título -->
    <h3 class="titulo-card">Faça seu Cadastro</h3>

    <!-- Formulário -->
    <form>

      <!-- Nome completo -->
      <div class="input-icone">
        <i class="fa-solid fa-user"></i>
        <input type="text" placeholder="Nome completo" required>
      </div>

      <!-- E-mail -->
      <div class="input-icone">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" placeholder="E-mail" required>
      </div>

      <!-- Senha -->
      <div class="input-icone">
        <i class="fa-solid fa-lock"></i>
        <input type="text" id="senha" placeholder="Senha (mínimo 8 caracteres)" required minlength="8">
      </div>

      <!-- Divisor -->
      <div class="divisor">ou cadastre-se com:</div>

      <!-- Ícones de login social -->
      <div class="icones-sociais">
        <a href="https://www.google.com/" target="_blank"><i class="fa-brands fa-google"></i></a>
        <a href="https://www.facebook.com/" target="_blank"><i class="fa-brands fa-facebook"></i></a>
        <a href="https://www.apple.com/" target="_blank"><i class="fa-brands fa-apple"></i></a>
      </div>

      <!-- Esqueceu a senha -->
      <a href="esqueceu-senha.html" class="link-vermelho">Esqueceu sua senha?</a>

      <!-- Botão cadastrar -->
      <button type="submit" class="btn-vermelho">CADASTRAR</button>

    </form>

    <!-- Rodapé -->
    <p class="texto-rodape">
      <a href="login.html">Entra em conta existente</a>
    </p>

  </div>

</body>

</html>
