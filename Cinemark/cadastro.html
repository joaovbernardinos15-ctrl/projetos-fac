<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinemark - Faça seu Cadastro</title>

  <!-- Bootstrap (só para o grid/reset, o visual mesmo é do style.css) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Font Awesome (ícones de pessoa, e-mail, cadeado, olho, google, facebook, apple) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Nosso CSS -->
  <link rel="stylesheet" href="./css/style2.css">
</head>

<body>

  <div class="card-login">

    <!-- Logo -->
    <div class="logo-losango">
      <i class="fa-solid fa-play"></i>
    </div>

    <!-- Título -->
    <h3 class="titulo-card">Faça seu Cadastro</h3>

    <!-- Formulário -->
    <form>

      <!-- Nome completo -->
      <div class="input-icone">
        <i class="fa-solid fa-user"></i>
        <input type="text" placeholder="Nome completo" required>
      </div>

      <!-- E-mail -->
      <div class="input-icone">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" placeholder="E-mail" required>
      </div>

      <!-- Senha -->
      <div class="input-icone">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="senha" placeholder="Senha" required>
      </div>

      <!-- Divisor -->
      <div class="divisor">ou cadastre-se com:</div>

      <!-- Ícones de login social -->
      <div class="icones-sociais">
        <a href="https://www.google.com/" target="_blank"><i class="fa-brands fa-google"></i></a>
        <a href="https://www.facebook.com/" target="_blank"><i class="fa-brands fa-facebook"></i></a>
        <a href="https://www.apple.com/" target="_blank"><i class="fa-brands fa-apple"></i></a>
      </div>

      <!-- Esqueceu a senha -->
      <a href="esqueci-senha.html" class="link-vermelho">Esqueceu sua senha?</a>

      <!-- Botão cadastrar -->
      <button type="submit" class="btn-vermelho">CADASTRAR</button>

    </form>

    <!-- Rodapé -->
    <p class="texto-rodape">
      <a href="login.html">Entra em conta existente</a>
    </p>

  </div>

</body>

</html>
