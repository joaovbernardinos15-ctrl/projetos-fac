<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" href="./img/Logo.jpeg" type="image/x-icon">
  <title>Cadastro / Login</title>
</head>

<body>

  <div class="card" id="card" data-mode="cadastro">

    <div class="logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="20" width="60" height="60" fill="none" stroke="#e63950" stroke-width="3"
          transform="rotate(45 50 50)" />
        <rect x="30" y="30" width="40" height="40" fill="none" stroke="#e63950" stroke-width="2.5"
          transform="rotate(45 50 50)" />
        <polygon points="43,38 43,62 65,50" fill="#e63950" />
      </svg>
    </div>

    <h1 id="title">Faça seu Cadastro</h1>

    <form id="form">

      <div class="field name-field">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <input type="text" placeholder="Nome completo">
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="m22 6-10 7L2 6" />
        </svg>
        <input type="email" placeholder="E-mail" required>
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <input type="password" id="senha" placeholder="Senha" required>
        <span class="toggle-eye" id="toggleEye">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
            <line id="eyeSlash" x1="3" y1="3" x2="21" y2="21" />
          </svg>
        </span>
      </div>

      <div class="divider" id="dividerText">ou cadastre-se com:</div>

      <div class="socials">
        <button type="button" class="social-btn" title="Google">
          <svg viewBox="0 0 48 48">
            <path fill="#FFC107"
              d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z" />
            <path fill="#FF3D00"
              d="m6.3 14.7 6.6 4.8C14.6 15.6 18.9 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.6 6 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z" />
            <path fill="#4CAF50"
              d="M24 44c5.5 0 10.4-1.9 14.2-5.2l-6.5-5.5C29.7 34.9 27 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.6 39.6 16.3 44 24 44z" />
            <path fill="#1976D2"
              d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.5l6.5 5.5C41.5 36.2 44 30.6 44 24c0-1.2-.1-2.4-.4-3.5z" />
          </svg>
        </button>
        <button type="button" class="social-btn" title="Facebook">
          <svg viewBox="0 0 24 24">
            <path fill="#1877F2"
              d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z" />
          </svg>
        </button>
        <button type="button" class="social-btn" title="Apple">
          <svg viewBox="0 0 24 24">
            <path
              d="M16.365 1.43c0 1.14-.462 2.11-1.19 2.87-.82.86-2.16 1.52-3.28 1.43-.14-1.12.42-2.28 1.13-3.02.79-.85 2.15-1.5 3.34-1.28zM20.6 17.14c-.51 1.18-1.13 2.32-2.03 3.35-.87 1-1.7 2.01-3.06 2.03-1.33.03-1.76-.79-3.28-.79s-1.99.77-3.25.81c-1.31.05-2.31-1.07-3.19-2.06-1.79-2.02-3.16-5.71-1.32-8.2.91-1.24 2.53-2.03 4.29-2.06 1.28-.02 2.49.86 3.28.86.79 0 2.25-1.06 3.79-.9.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.27-2.15 3.79.03 3.01 2.64 4.02 2.68 4.03-.02.07-.42 1.44-1.4 2.16z"
              fill="#000" />
          </svg>
        </button>
      </div>

      <a href="#" class="forgot">Esqueceu sua senha?</a>

      <button type="submit" class="submit-btn" id="submitBtn">CADASTRAR</button>

    </form>

    <a href="#" class="switch-link" id="switchLink">Entra em conta existente</a>

  </div>

  <script>
    const card = document.getElementById('card');
    const title = document.getElementById('title');
    const submitBtn = document.getElementById('submitBtn');
    const switchLink = document.getElementById('switchLink');
    const dividerText = document.getElementById('dividerText');
    const forgot = document.querySelector('.forgot');

    switchLink.addEventListener('click', (e) => {
      e.preventDefault();
      const mode = card.getAttribute('data-mode');
      if (mode === 'cadastro') {
        card.setAttribute('data-mode', 'login');
        title.textContent = 'Faça seu Login';
        submitBtn.textContent = 'ENTRAR';
        switchLink.textContent = 'Criar nova conta';
        dividerText.textContent = 'ou entre com:';
      } else {
        card.setAttribute('data-mode', 'cadastro');
        title.textContent = 'Faça seu Cadastro';
        submitBtn.textContent = 'CADASTRAR';
        switchLink.textContent = 'Entra em conta existente';
        dividerText.textContent = 'ou cadastre-se com:';
      }
    });

    const toggleEye = document.getElementById('toggleEye');
    const senha = document.getElementById('senha');
    const eyeSlash = document.getElementById('eyeSlash');
    let visible = false;
    toggleEye.addEventListener('click', () => {
      visible = !visible;
      senha.type = visible ? 'text' : 'password';
      eyeSlash.style.display = visible ? 'none' : 'block';
    });

  </script>

</body>

</html>
