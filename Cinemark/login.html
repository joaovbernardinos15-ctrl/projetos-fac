<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./css/style2.css">
</head>

<body>

  <div class="card-login">

    <!-- Logo -->
    <div class="logo-losango">
      <i class="fa-solid fa-play"></i>
    </div>

    <!-- Título -->
    <h3 class="titulo-card">Faça seu Login</h3>

    <!-- Formulário -->
    <form>

      <!-- E-mail -->
      <div class="input-icone">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" placeholder="E-mail" required>
      </div>

      <!-- Senha -->
      <div class="input-icone">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="senha" placeholder="Senha" required>
        <i class="fa-solid fa-eye-slash icone-olho" onclick="mostrarSenha()"></i>
      </div>

      <!-- Divisor -->
      <div class="divisor">ou entre com:</div>

      <!-- Ícones de login social -->
      <div class="icones-sociais">
        <a href="#"><i class="fa-brands fa-google"></i></a>
        <a href="#"><i class="fa-brands fa-facebook"></i></a>
        <a href="#"><i class="fa-brands fa-apple"></i></a>
      </div>

      <!-- Esqueceu a senha -->
      <a href="esqueci-senha.html" class="link-vermelho">Esqueceu sua senha?</a>

      <!-- Botão entrar -->
      <button type="submit" class="btn-vermelho">ENTRAR</button>

    </form>

    <!-- Rodapé -->
    <p class="texto-rodape">
      Não tem conta? <a href="cadastro.html">Cadastre-se</a>
    </p>

  </div>

</body>

</html>
