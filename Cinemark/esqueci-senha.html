<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinemark - Esqueci minha Senha</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./css/style2.css">
</head>

<body>

  <div class="card-login">

    <!-- Logo -->
    <div class="logo-losango">
      <i class="fa-solid fa-play"></i>
    </div>

    <!-- Título -->
    <h3 class="titulo-card">Esqueci minha Senha</h3>

    <!-- Texto explicando o que fazer -->
    <p class="texto-explicacao">
      Digite seu e-mail cadastrado que enviaremos um link para você criar uma nova senha.
    </p>

    <!-- Formulário -->
    <form>

      <!-- E-mail -->
      <div class="input-icone">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" placeholder="E-mail" required>
      </div>

      <!-- Botão enviar -->
      <button type="submit" class="btn-vermelho">ENVIAR LINK</button>

    </form>

    <!-- Rodapé -->
    <p class="texto-rodape">
      <a href="login.html">Voltar para o Login</a>
    </p>

  </div>

</body>

</html>
